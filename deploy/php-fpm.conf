; PHP-FPM pool of the app, installed by install.sh and release.sh.
; A fixed set of workers: each one keeps its persistent connection to the remote database
; open (opening one takes about a second), so no request pays for a freshly spawned worker.
; Workers + the queue, media and Reverb services must stay within the Supabase pooler size.
[turadioonline]
user = www-data
group = www-data
listen = /run/php/php8.3-fpm-turadioonline.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660
pm = static
pm.max_children = 6
php_admin_value[upload_max_filesize] = 200M
php_admin_value[post_max_size] = 200M
php_admin_value[memory_limit] = 256M
php_admin_value[max_execution_time] = 120
