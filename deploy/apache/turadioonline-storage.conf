# Uploaded files are data only: never execute them as scripts.
# Installed by deploy/install.sh into /etc/apache2/conf-available/.
<Directory /opt/turadioonline/storage/app/public>
    Options -ExecCGI -Indexes +FollowSymLinks
    AllowOverride None
    <FilesMatch "\.(php|phar|phtml|php\d|pht|cgi|pl|py|sh)$">
        Require all denied
    </FilesMatch>
</Directory>
<Directory /opt/turadioonline/public/storage>
    <FilesMatch "\.(php|phar|phtml|php\d|pht|cgi|pl|py|sh)$">
        Require all denied
    </FilesMatch>
</Directory>
